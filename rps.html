<!DOCTYPE html>
<html lang="en-US">
  <script>

    let humanScore = 0
    let computerScore = 0

    function getComputerChoice() {
      let x = Math.random();
      if (x < 0.33) {
        // let computerChoice = "Scissors";
        return "scissors";
      } else if (x >= 0.33 && x < 0.66) {
        // let computerChoice = "Rock";
        return "rock";
      } else {
        // let computerChoice = "Paper";
        return "paper";
      }
    }

    function getHumanChoice() {
      let y = prompt("Scissors, paper, rock?");
      if (y.toLowerCase() === "scissors") {
        return "scissors";
      } else if (y.toLowerCase() === "rock") {
        return "rock";
      } else if (y.toLowerCase() === "paper") {
        return "paper";
      } else {
        alert("Valid input pls, try again");
        let y = prompt("Scissors, paper, rock?");
      }
    }

    function playRound(humanChoice, computerChoice) {  
      if (humanChoice === 'rock' && computerChoice === 'scissors') {
        humanScore++;
        alert(`You win! Yay! Your score is ${humanScore}. Your opponent's score is ${computerScore}.`);
        console.log(humanChoice);
        console.log(computerChoice);
      } else if (humanChoice === 'paper' && computerChoice === 'rock') {
        humanScore++
        alert(`You win! Yay! Your score is ${humanScore}. Your opponent's score is ${computerScore}.`);
        console.log(humanChoice);
        console.log(computerChoice);
      } else if (humanChoice === 'scissors' && computerChoice === 'paper') {
        humanScore++;
        alert(`You win! Yay! Your score is ${humanScore}. Your opponent's score is ${computerScore}.`);
        console.log(humanChoice);
        console.log(computerChoice);
      } else if (humanChoice = computerChoice) {
        alert(`Tie! Try again. Your score is ${humanScore}. Your opponent's score is ${computerScore}. `);
      } else {
        computerScore++;
        alert(`booooooo, try again. Your score is ${humanScore}. Your opponent's score is ${computerScore}.`);
        console.log(humanChoice);
        console.log(computerChoice);
      }
    }

    function playGame() {
      for (let round = 0; round < 5; round++) {
        const humanInput = getHumanChoice();
        const computerInput = getComputerChoice();
        playRound(humanInput, computerInput);
      }
      alert(`Your final score is ${humanScore}. Your opponent's final score is ${computerScore}`);
    }


    playGame()

  </script>
</html>
